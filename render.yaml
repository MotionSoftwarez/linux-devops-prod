# Render.com blueprint — deploys the FastAPI backend as a web service.
# Create → New Blueprint → select this GitHub repo.
services:
  - type: web
    name: linotutor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt
      && python scripts/seed.py
      && python scripts/import_content.py
      && python scripts/import_cheatsheets.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
